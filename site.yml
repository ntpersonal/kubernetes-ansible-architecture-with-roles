---
- name: Common Kubernetes Setup
  hosts: k8s_cluster
  become: yes
  roles:
    - common

- name: Setup Kubernetes Master
  hosts: masters
  become: yes
  roles:
    - kubernetes_master

- name: Setup Kubernetes Workers
  hosts: workers
  become: yes
  roles:
    - kubernetes_worker

- name: Setup Node Exporter on ALL nodes (host-level metrics)
  hosts: k8s_cluster
  become: yes
  tasks:
    - name: Create node_exporter user
      user:
        name: node_exporter
        shell: /bin/false
        create_home: no
        system: yes

    - name: Download Node Exporter with curl
      shell: |
        curl -L --retry 3 --retry-delay 5 \
          "https://github.com/prometheus/node_exporter/releases/download/v1.7.0/node_exporter-1.7.0.linux-amd64.tar.gz" \
          -o /tmp/node_exporter.tar.gz
        # Verify it's a valid gzip file
        file /tmp/node_exporter.tar.gz | grep -q "gzip" || exit 1
      args:
        creates: /tmp/node_exporter.tar.gz

    - name: Extract Node Exporter
      shell: tar -xzf /tmp/node_exporter.tar.gz -C /tmp/
      args:
        creates: /tmp/node_exporter-1.7.0.linux-amd64/node_exporter

    - name: Install Node Exporter binary
      copy:
        src: /tmp/node_exporter-1.7.0.linux-amd64/node_exporter
        dest: /usr/local/bin/node_exporter
        mode: '0755'
        owner: node_exporter
        group: node_exporter
        remote_src: yes

    - name: Create Node Exporter systemd service
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start Node Exporter
      systemd:
        name: node_exporter
        state: started
        enabled: yes
        daemon_reload: yes

- name: Setup Kubernetes In-Cluster Monitoring (Prometheus + Grafana as K8s pods)
  hosts: masters
  become: yes
  roles:
    - k8s_monitoring
