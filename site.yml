---
# NOTE: common, kubernetes_master and kubernetes_worker roles are called
# directly by Heat runcmd during bootstrap. Ansible is only responsible
# for monitoring deployment after the cluster is ready.

- name: Setup Node Exporter on ALL nodes (host-level metrics)
  hosts: k8s_cluster
  become: yes
  tasks:
    - name: Create node_exporter user
      user:
        name: node_exporter
        shell: /bin/false
        create_home: no
        system: yes

    - name: Check if node_exporter already installed
      stat:
        path: /usr/local/bin/node_exporter
      register: node_exporter_binary

    - name: Download Node Exporter with curl
      shell: |
        curl -L --retry 3 --retry-delay 5 \
          "https://github.com/prometheus/node_exporter/releases/download/v1.7.0/node_exporter-1.7.0.linux-amd64.tar.gz" \
          -o /tmp/node_exporter.tar.gz
        file /tmp/node_exporter.tar.gz | grep -q "gzip" || exit 1
      when: not node_exporter_binary.stat.exists

    - name: Extract Node Exporter
      shell: tar -xzf /tmp/node_exporter.tar.gz -C /tmp/
      when: not node_exporter_binary.stat.exists

    - name: Install Node Exporter binary
      copy:
        src: /tmp/node_exporter-1.7.0.linux-amd64/node_exporter
        dest: /usr/local/bin/node_exporter
        mode: '0755'
        owner: node_exporter
        group: node_exporter
        remote_src: yes
      when: not node_exporter_binary.stat.exists

    - name: Create Node Exporter systemd service
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start Node Exporter
      systemd:
        name: node_exporter
        state: started
        enabled: yes
        daemon_reload: yes

- name: Setup Kubernetes In-Cluster Monitoring (Prometheus + Grafana as K8s pods)
  hosts: masters
  become: yes
  roles:
    - k8s_monitoring
